<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 2560px;
    height: 1440px;
    background: #050811;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .bg-grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
    background-size: 64px 64px;
  }
  .bg-glow {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 30% 50%, rgba(14, 165, 233, 0.16), transparent 45%),
      radial-gradient(circle at 72% 50%, rgba(245, 158, 11, 0.12), transparent 45%);
  }
  /* YouTube Safe Zone: 1546 x 423 centered */
  .safe-zone {
    position: relative;
    width: 1546px;
    height: 423px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 72px;
    border-radius: 36px;
    background: rgba(10, 17, 34, 0.78);
    border: 2px solid rgba(56, 189, 248, 0.28);
    box-shadow: 0 24px 90px rgba(0, 0, 0, 0.65);
  }
  .left {
    display: flex;
    align-items: center;
    gap: 44px;
  }
  .badge-icon {
    width: 220px;
    height: 220px;
    border-radius: 48px;
    background: linear-gradient(145deg, #0e1931 0%, #070c18 100%);
    border: 3px solid rgba(56, 189, 248, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .text-col {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .kicker {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 5px;
    color: #f59e0b;
    text-transform: uppercase;
  }
  h1 {
    font-size: 86px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #f8fafc;
    line-height: 1.02;
  }
  h1 span {
    color: #38bdf8;
  }
  .tagline {
    font-size: 32px;
    font-weight: 500;
    color: #cbd5e1;
    letter-spacing: 0.5px;
  }
  .right {
    display: flex;
    flex-direction: column;
    gap: 16px;
    align-items: flex-end;
  }
  .pill {
    padding: 12px 24px;
    border-radius: 999px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #e2e8f0;
    background: rgba(15, 23, 42, 0.9);
    border: 1.5px solid rgba(56, 189, 248, 0.35);
  }
  .pill.accent {
    border-color: rgba(245, 158, 11, 0.55);
    color: #fde68a;
  }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="safe-zone">
    <div class="left">
      <div class="badge-icon">
        <svg width="160" height="140" viewBox="0 0 340 280" fill="none">
          <line x1="65" y1="80" x2="145" y2="140" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.7" />
          <line x1="65" y1="200" x2="145" y2="140" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.7" />
          <line x1="145" y1="140" x2="225" y2="85" stroke="#f59e0b" stroke-width="7" />
          <line x1="145" y1="140" x2="275" y2="140" stroke="#38bdf8" stroke-width="7" />
          <line x1="145" y1="140" x2="225" y2="195" stroke="#22c55e" stroke-width="7" />
          <circle cx="65" cy="80" r="18" fill="#0c1428" stroke="#38bdf8" stroke-width="6" />
          <circle cx="65" cy="200" r="18" fill="#0c1428" stroke="#38bdf8" stroke-width="6" />
          <polygon points="145,98 187,140 145,182 103,140" fill="#0c1428" stroke="#38bdf8" stroke-width="7" />
          <circle cx="145" cy="140" r="14" fill="#f59e0b" />
          <circle cx="225" cy="85" r="17" fill="#0c1428" stroke="#f59e0b" stroke-width="6" />
          <circle cx="275" cy="140" r="19" fill="#0c1428" stroke="#38bdf8" stroke-width="6" />
          <circle cx="225" cy="195" r="17" fill="#0c1428" stroke="#22c55e" stroke-width="6" />
        </svg>
      </div>
      <div class="text-col">
        <div class="kicker">Visual System Breakdowns &bull; Hinglish</div>
        <h1>DECODE <span>SYSTEMS</span></h1>
        <div class="tagline">Invisible Tech &amp; AI &mdash; Decoded Visually</div>
      </div>
    </div>
    <div class="right">
      <div class="pill accent">2-MIN VISUAL SHORTS</div>
      <div class="pill">6-MIN 16:9 DEEP DIVES</div>
    </div>
  </div>
</body>
</html>
