<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: transparent;
    font-family: "Kohinoor Devanagari", -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    color: #f8fafc;
  }
  .hud-top {
    position: absolute; top: 28px; left: 44px; right: 44px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .brand-pill, .stat-pill {
    display: flex; align-items: center; gap: 12px;
    background: rgba(8, 13, 24, 0.78);
    border: 1px solid rgba(56, 189, 248, 0.34);
    backdrop-filter: blur(10px);
    padding: 10px 20px; border-radius: 999px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #f59e0b; box-shadow: 0 0 12px #f59e0b;
  }
  .dot.green { background: #10b981; box-shadow: 0 0 12px #10b981; }
  .brand-txt { font-size: 17px; font-weight: 700; letter-spacing: 0.08em; color: #e2e8f0; }
  .ch-tag { font-size: 16px; font-weight: 700; color: #38bdf8; }
  .sep { color: rgba(148,163,184,0.45); }
  .stat-val { font-family: ui-monospace, monospace; font-size: 17px; font-weight: 700; color: #fbbf24; }
  .stat-val.green { color: #34d399; }

  .progress-wrap {
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: rgba(255,255,255,0.08);
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #f59e0b, #38bdf8, #10b981);
  }

  .hud-bottom {
    position: absolute; bottom: 30px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .spk-badge {
    display: none; align-items: center; gap: 8px;
    background: rgba(245, 158, 11, 0.22);
    border: 1px solid rgba(251, 191, 36, 0.72);
    color: #fde68a; font-size: 15px; font-weight: 700;
    padding: 5px 16px; border-radius: 999px;
    letter-spacing: 0.06em;
  }
  .spk-badge.show { display: inline-flex; }
  .cap-box {
    max-width: 1460px;
    background: rgba(7, 11, 21, 0.84);
    border: 1px solid rgba(148, 163, 184, 0.28);
    padding: 13px 30px; border-radius: 16px;
    font-size: 31px; font-weight: 600; line-height: 1.35;
    text-align: center;
    box-shadow: 0 12px 34px rgba(0,0,0,0.55);
  }
  .hl { color: #fbbf24; font-weight: 800; }
</style>
</head>
<body>
  <div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>

  <div class="hud-top">
    <div class="brand-pill">
      <div class="dot" id="chDot"></div>
      <span class="brand-txt">ETERNAL STUDENT</span>
      <span class="sep">|</span>
      <span class="ch-tag" id="chLabel">CH 1/6 · THE 2 AM PROBLEM</span>
    </div>
    <div class="stat-pill">
      <span class="brand-txt" id="vmLabel">RUNTIME:</span>
      <span class="stat-val" id="vmVal">LOCAL 8GB · 99%</span>
    </div>
  </div>

  <div class="hud-bottom">
    <div class="spk-badge" id="spkBadge">SMART DOUBT · KAVYA</div>
    <div class="cap-box" id="capBox"></div>
  </div>

<script>
const CHAPTERS = {
  1: { name: "CH 1/6 · THE 2 AM PROBLEM", vm: "LOCAL 8GB · OOM", cls: "" },
  2: { name: "CH 2/6 · CLOUD CONTAINER ARCHITECTURE", vm: "UBUNTU VM · 12.7GB RAM", cls: "green" },
  3: { name: "CH 3/6 · CPU vs T4 GPU vs TPU", vm: "TESLA T4 · 15.3GB VRAM", cls: "green" },
  4: { name: "CH 4/6 · !SHELL, 400MB/s & @PARAM", vm: "COLAB BACKBONE · ACTIVE", cls: "green" },
  5: { name: "CH 5/6 · 12-HR WIPEOUT & DRIVE VAULT", vm: "/content/drive · MOUNTED", cls: "green" },
  6: { name: "CH 6/6 · LIMITS & REAL-WORLD MASTERY", vm: "T4 34.4× FASTER ✓", cls: "green" },
};

let M = null;
window.initDoc = (manifest) => { M = manifest; window.seekToMs(0); };

function formatCap(txt) {
  return txt
    .replace(/(Google Colab|NVIDIA T4 GPU|Tesla T4|TPU|CUDA|IPython Kernel|Ubuntu VM|drive\.mount|Colab Secrets|userdata\.get|@param|!nvidia-smi|34\.4× Faster!|17\.94s|0\.522s|2,560|15\.3 GB|12\.7 GB)/g, '<span class="hl">$1</span>');
}

window.seekToMs = (ms) => {
  if (!M) return;
  const pct = Math.max(0, Math.min(100, (ms / M.total_ms) * 100));
  document.getElementById("pbar").style.width = pct.toFixed(2) + "%";

  let cur = M.beats[0];
  for (const b of M.beats) {
    if (ms >= b.start_ms - 180) cur = b;
  }
  const ch = CHAPTERS[cur.ch] || CHAPTERS[1];
  document.getElementById("chLabel").textContent = ch.name;
  document.getElementById("vmVal").textContent = ch.vm;
  document.getElementById("vmVal").className = "stat-val " + ch.cls;
  document.getElementById("chDot").className = "dot " + ch.cls;

  const badge = document.getElementById("spkBadge");
  if (cur.spk === "kavya" && ms <= cur.end_ms + 250) {
    badge.classList.add("show");
  } else {
    badge.classList.remove("show");
  }

  document.getElementById("capBox").innerHTML = formatCap(cur.cap || "");
};
</script>
</body>
</html>
